# Cloudflare Pages/Workers deploy config (#114).
# Static frontend: `dist/` (vite build). API: worker/app.ts (Hono).
# First production runs WITHOUT D1 provisioned: create it with
#   bunx wrangler d1 create kirei-toilet-community
# then set the database_id below and apply worker/schema.sql.

name = "kirei-toilet"
main = "worker/app.ts"
compatibility_date = "2026-09-16"

[site]
bucket = "dist"

[vars]
NODE_ENV = "production"

# Each namespace_id must be unique in the Cloudflare account; verify before deployment.
# Limits are per Cloudflare location (not globally exact).
[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "34010801"
[ratelimits.simple]
limit = 120
period = 60

[[ratelimits]]
name = "WRITE_RATE_LIMITER"
namespace_id = "34010802"
[ratelimits.simple]
limit = 30
period = 60

[[ratelimits]]
name = "VOTE_RATE_LIMITER"
namespace_id = "34010803"
[ratelimits.simple]
limit = 60
period = 60

# [[d1_databases]]
# binding = "DB"
# database_name = "kirei-toilet-community"
# database_id = "REPLACE_WITH_D1_ID"

# Optional OSM proxy cache (create/provision separately; no Production ID is committed):
# [[kv_namespaces]]
# binding = "OSM_CACHE"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (never commit values):
#   bunx wrangler secret put COMMUNITY_SALT   # required: fixed salt for IP-hash vote/dedup guards
#   bunx wrangler secret put ADMIN_TOKEN      # optional: enables admin moderation API
