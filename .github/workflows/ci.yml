name: CI

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Commit regenerated Bun lockfile
        shell: bash
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore: update Bun lockfile for workerd tests"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      # B: data/community.json はgit運用の正本。untrackedに戻っていないか監視する
      - run: git ls-files data/ | grep -q "data/community.json"
      - run: bun run lint
      - run: bun run test
      - run: bun run test:worker
      - run: bun run build
      # G: 本番バンドルの最小E2Eスモーク（health/community/admin-guard/osm検証）
      - run: bun run smoke
